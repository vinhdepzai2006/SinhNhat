<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Hà Tâm 🎂</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NHẠC NỀN -->
  <audio id="bgMusic" loop>
    <source src="/Happy Birthday (Piano Version).mp3" type="audio/mpeg" />
  </audio>

  <!-- =====================================================
       MÀN HÌNH 0 – HỘP QUÀ (màn hình đầu tiên)
       👉 THAY src của #giftGif bằng link GIF hộp quà từ Giphy
          Ví dụ: src="https://media.giphy.com/media/xxx/giphy.gif"
       ===================================================== -->
  <div id="gift-screen" class="screen active">
    <!-- Bong bóng trang trí -->
    <div class="balloon-wrap" id="balloonWrap"></div>
    <!-- Pháo giấy nền -->
    <div class="confetti-wrap" id="confettiWrap"></div>

    <!-- Chữ phía trên -->
    <div class="gift-title" id="giftTitle">
      <span>🎉</span> Có một điều bất ngờ dành cho bạn <span>🎉</span>
    </div>

    <!-- Hộp quà GIF – ấn vào để bắt đầu -->
    <div class="gift-box-wrap" id="giftBoxWrap" onclick="GiftPhase.open()">
      <!-- ===================================================
           👉 THAY src DƯỚI ĐÂY BẰNG LINK GIF HỘP QUÀ CỦA BẠN
              Ví dụ từ Giphy: https://media.giphy.com/media/...gif
           =================================================== -->
      <img id="giftGif"
           src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeDFwcmh0YWRvdW92bWxmYndmemd3YzFjY2U5a3g4bno1azZybm50NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/BmSizh311R7yI3M4v9/giphy.gif"
           alt="Hộp quà" />
      <div class="gift-pulse-ring"></div>
    </div>

    <!-- Chữ mời bấm -->
    <div class="gift-label" id="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cjFrdDVkZTV1NTE3enM4bWZncXFmbzc2ajZzaXl1ODc3cnMxZnJ1OCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/BmSizh311R7yI3M4v9/giphy.gif">
      Bấm vào hộp quà để mở 🎀
    </div>

    <!-- Kitty 4 góc trang trí -->
    <img class="gift-kitty" style="top:2%;left:2%"
         src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOGdrdTF1emZtd3lremI2bzAxZXA0ZnU1bTR2dHE3NGRhbDZ1a251byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/WOrrqJoBplyOU1QCRn/giphy.gif" alt="kitty" />
    <img class="gift-kitty" style="top:2%;right:2%"
         src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTQyZDFjZGs1ZHgyNWJlcDRiOTQ0b29mdzNjcTBoOWMwY2Vqb3JhcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cqLLVhiJc7t4ZZijyS/giphy.gif" alt="kitty" />
    <img class="gift-kitty" style="bottom:2%;left:2%"
         src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXp2YnBkNzhlOG5kbm81MzluaWEzMDU4cmQzYXEzYjdxdDlkZzIyMyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/hBFR4rbtBBJiE/giphy.gif" alt="kitty" />
    <img class="gift-kitty" style="bottom:2%;right:2%"
         src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaW40dXl2bXhhZ28yd3RoNWFncjY4OW9kYXpidjJ1ZGN5Z2VsNjdmcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MBmjxPvh18biwibx1G/giphy.gif" alt="kitty" />
  </div>

  <!-- =====================================================
       MÀN HÌNH 1 – ĐẾM NGƯỢC 3 → 2 → 1
       ===================================================== -->
  <div id="countdown-screen" class="screen">
    <canvas id="matrixCanvas"></canvas>
  </div>

  <!-- =====================================================
       MÀN HÌNH 2 – HIỆN CHỮ HAPPY / BIRTHDAY / HÀ TÂM
       ===================================================== -->
  <div id="text-screen" class="screen">
    <canvas id="textCanvas"></canvas>
    <div class="word-row">
      <canvas id="wordCanvas1" class="word-canvas"></canvas>
    </div>
    <div class="word-row">
      <canvas id="wordCanvas2" class="word-canvas"></canvas>
    </div>
    <div class="word-row">
      <canvas id="wordCanvas3" class="word-canvas"></canvas>
    </div>
  </div>

  <!-- =====================================================
       MÀN HÌNH 3 – BÁNH SINH NHẬT
       ===================================================== -->
  <div id="cake-screen" class="screen">
    <div class="sp-bg" id="spBg"></div>
    <div class="fh-wrap" id="fhWrap"></div>

    <img class="kitty-deco" style="top:3%;left:2%"     src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExdDFqYWh3Nmh0eHY3anQyaHBhZXc3NWl6aTZ5ODhiN2xpZDVyOXp4eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/jpiR29W0Ksmu0jHoQW/giphy.gif" alt="kitty" />
    <img class="kitty-deco" style="top:3%;right:2%"    src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2ZiNjRjdGs1ZWt5bHFwbWNiM2VrdmVvMXhjM3pqanV3cjBqMm04ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/jEGrjimxSiPkWXFlU7/giphy.gif" alt="kitty" />
    <img class="kitty-deco" style="bottom:3%;left:2%"  src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXJycXExMGN2bWJwNnVsdzY3NTQ2dzAybG44enJjaG51ZmdocDdiOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/6ok2rFOweFjlvdcaez/giphy.gif" alt="kitty" />
    <img class="kitty-deco" style="bottom:3%;right:2%" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXR6dTR6NjFiMDRjMXYzNzF2N2k1dWN1amVueDQ0ZTgwY3RyZzZrOCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/10a8AOSeP6Rqfu/giphy.gif" alt="kitty" />
    <img class="kitty-deco kitty-rand" style="top:38%;left:1%"   src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExYjlic3hlNzZ5NmpoNXdta3JuNGY5ZHBseTRseGhqcjQzZTlld2ZxZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/0tyNsehlBJBjJKQXRo/giphy.gif" alt="kitty" />
    <img class="kitty-deco kitty-rand" style="top:38%;right:1%"  src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXR6dTR6NjFiMDRjMXYzNzF2N2k1dWN1amVueDQ0ZTgwY3RyZzZrOCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/XTpzuhXQOCggM/giphy.gif" />
    <img class="kitty-deco kitty-rand" style="top:72%;left:50%;transform:translateX(-50%)" src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3d3g0aDdmbTdhamxqYm9ib3h5aWxvbm4xNGFxYmpiYms1eWpzd3dwMCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/KgckDLb8Vm40hip2QW/giphy.gif" alt="kitty" />

    <img class="kitty-deco kitty-around" style="top:12%;left:50%;transform:translateX(-50%)"
         src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bGE5NjM5NmpzYzdzMjBwNWFhYjE3bnFieXVzemYwM3dwMHFxdDh3MyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/QxppxLafWsyzgMhMsK/giphy.gif" />
    <img class="kitty-deco kitty-around" style="top:50%;left:17%;transform:translateY(-50%)"
         src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZGMxcTlyN254aDc1Njh2enhqdTJ5bDloODUwdnpxcmJtb2dkODV4ayZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/hULQny0qPBKIlqsZ5e/giphy.gif" alt="kitty" />
    <img class="kitty-deco kitty-around" style="top:50%;right:17%;transform:translateY(-50%)"
         src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZGMxcTlyN254aDc1Njh2enhqdTJ5bDloODUwdnpxcmJtb2dkODV4ayZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/Af5WVSpa9qxnbq8M9T/giphy.gif" alt="kitty" />

    <img class="cake-img" id="cakeImg"
         src="/banhsinhnhat.png"
         alt="Bánh sinh nhật Hà Tâm" />

    <div class="hbw">
      <div class="hbtn" id="heartBtn" onclick="App.goHeart()">❤️</div>
      <div class="hlabel">Bấm vào tim để thổi nến 🕯️</div>
    </div>
  </div>

  <!-- =====================================================
       MÀN HÌNH 4 – HÌNH TRÁI TIM TỪ ẢNH
       ===================================================== -->
  <div id="heart-screen" class="screen">
    <div class="sp-bg" id="spBg2"></div>
    <img class="ks left"  src="https://media.tenor.com/F0DGMYslawQAAAAm/sanrio.webp" alt="kitty cupid" />
    <img class="ks right" src="https://media.tenor.com/F0DGMYslawQAAAAm/sanrio.webp" alt="kitty cupid" />
    <div class="hc" id="hc"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
